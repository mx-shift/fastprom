# LCSC part numbers for JLCPCB assembly of the two-board stack.
#
# Keyed by the netlist value and footprint, so a value or footprint change in
# the schematic that is not reflected here fails `make jlc` loudly rather
# than ordering the wrong part. Captured 2026-11-01; stock moves, so check
# each line on jlcpcb.com/parts before ordering.
#
# lcsc: ""   means JLC cannot place it from LCSC stock - see `note`.
# dnp: true  means it is deliberately not fitted.
# loose: true means JLC does not fit it; it ships alongside the assembled
#             boards and is fitted by hand.

parts:
  - value: AG32VF303KCU6
    footprint: fastprom:QFN-32-1EP_4x4mm_P0.4mm_EP2.65x2.65mm
    mpn: AG32VF303KCU6
    lcsc: C41397171
