    lcsc: C669076
    note: >
      YXC 12 MHz CMOS oscillator, 2.0 x 1.6 mm, 1.8-3.3 V; pinout 1 OE,
      2 GND, 3 OUT, 4 VDD, checked against YXC's YSO110TR datasheet, with
      the land pattern (docs/07-bom.md). The PLL multiplies it to a
      1200 MHz VCO, divided to 60 MHz for USB and 200 MHz for the BRAM.
