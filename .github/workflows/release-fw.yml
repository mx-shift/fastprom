# Firmware release: push a tag fw-v<VERSION> (VERSION as in fw/Cargo.toml's
# workspace version, e.g. fw-v0.1.0) to publish the AG32 firmware's ELF and
# raw binary. scripts/release_fw.sh does the work and refuses a tag that
# disagrees with the crate version, or failing host tests or lints. Boards
# are released apart: release-hw.yml.
name: release-fw

on:
  push:
    tags: ["fw-v*"]
  # a dry run from the Actions tab: builds and checks everything at the
  # version in the tree, publishes nothing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # the firmware's container runs under docker, as the runner's user:
      # under the runner's rootless podman the container's user cannot
      # write the checkout (see release-hw.yml)
      FW_ENGINE: docker
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # earlier tags, for the release notes

      - name: Tools
        run: |
          # tools/mkweb.py and tools/mkbundle.py read tools/partdb.yaml
          sudo apt-get update -q
          sudo apt-get install -yq python3-yaml

      - name: Build
        run: |
          # a tag names the version to check against the tree; a dry run
          # takes the tree's own
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#fw-v}; else v=; fi
          scripts/release_fw.sh $v

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#fw-v}
          prev=$(git describe --tags --abbrev=0 --match 'fw-v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "FastPROM AG32 firmware $ver."
            echo
            echo "- \`fastprom-fw-$ver.bin\`: the application, raw image for flash at 0x80008000"
            echo "- \`fastprom-fw-$ver-dfu.bin\`: the DFU stage, raw image for flash at 0x80000000"
            echo "- \`fastprom-fw-$ver-recovery.bin\`: the recovery loader, which the page uploads into SRAM"
            echo "  through the mask ROM for UART recovery (never flashed)"
            echo "- \`fastprom-fw-$ver.elf\`, \`-dfu.elf\`, \`-recovery.elf\`: the same with symbols, for debugging"
            echo "- \`fastprom-fw-$ver-layout.txt\`: sections and the flash map"
            echo "- \`fastprom-web-$ver.zip\`: the update page, a static site with this firmware's update"
            echo "  bundle (docs/12-web.md); host it anywhere over HTTPS, or open it with \`?sim\` to try it"
            echo
            echo "Programming, and the combined image with the fabric bitstream"
            echo "(make fw-batch, which needs AGM's SDK): docs/06-build-and-flash.md."
            if [ -n "$prev" ]; then
              echo
              echo "Changes since $prev:"
              git log --format='- %s' "$prev..$GITHUB_REF_NAME" -- fw tools/rust tools/mkimage.py tools/mkimagetable.py tools/fw_layout.py tools/fw_stamp.py web tools/mkweb.py tools/mkbundle.py
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" build/release/fw/* \
            --title "FastPROM firmware $ver" --notes-file notes.md
