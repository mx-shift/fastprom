    "hw/lib/fastprom.pretty/R_Array_Convex_4x0402.kicad_mod",
    "hw/lib/fastprom.pretty/TestPoint_Pad_D1.0mm.kicad_mod",
]
SPDX-FileCopyrightText = ["KiCad Libraries contributors", "2026 mxshift"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The SOICbite programming footprint (J3), Simon Merrett's, BSD-2-Clause:
# github.com/SimonMerrett/SOICbite, renamed, pads and holes unchanged (its
# pin 1 cup replaced by the project's pin 1 triangle).
[[annotations]]
path = "hw/lib/fastprom.pretty/SOICbite_2x04_P1.27mm_BoardEdge.kicad_mod"
